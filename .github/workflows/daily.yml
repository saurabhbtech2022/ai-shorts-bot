# Three Shorts per day (15s): subah 08:00, dopahar 13:00, sham 18:00 IST.
# Timing is owned by cron-job.org, which calls workflow_dispatch with an
# explicit slot. GitHub's own schedule is not used: it delays for hours and
# a late run was uploading the next day's morning video after midnight.

name: Daily AI Short

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "morning | afternoon | evening"
        required: true
        default: morning
        type: choice
        options:
          - morning
          - afternoon
          - evening

permissions:
  contents: write

jobs:
  upload-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve slot
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          case "$SLOT" in
            morning|afternoon|evening)
              echo "SLOT=$SLOT" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Refusing to run without an explicit slot from cron-job.org."
              exit 1
              ;;
          esac

      - name: Skip if this slot already uploaded
        id: gate
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          slot = os.environ["SLOT"]
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          done = []
          path = Path("data/state.json")
          if path.is_file():
              state = json.loads(path.read_text())
              done = list((state.get("daily_slots") or {}).get(today) or [])
          skip = slot in done and os.environ.get("GITHUB_EVENT_NAME") == "schedule"
          print(f"today={today} slot={slot} done={done} skip={skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          PY
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Set up Python 3.11
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto

      - name: Install Python dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run pipeline for slot
        if: steps.gate.outputs.skip != 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VIDEO_DURATION: "15"
          SCENES_PER_RUN: "1"
          ENABLE_VOICEOVER: "true"
          TTS_FALLBACK_GTTS: "true"
          ENABLE_TEXT_OVERLAY: "true"
          ENABLE_PART_BADGE: "true"
          ENABLE_SUBSCRIBE_CTA: "true"
          PRIVACY_STATUS: public
          TIMEZONE: Asia/Kolkata
        run: python run_daily.py --slot "$SLOT"

      - name: Commit state.json if changed
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update state after ${{ env.SLOT }} short"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
